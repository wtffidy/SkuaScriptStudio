name: Build and Test

on:
  push:
    branches:
      - main
      - mobile
      - dev/**
  pull_request:
    branches:
      - main
      - dev/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SkuaScriptStudio.sln

      - name: Build
        run: dotnet build SkuaScriptStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SkuaScriptStudio.sln --configuration Release --no-build --logger "console;verbosity=normal"
